<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Body: dark obsidian sphere. The deep range ensures the silhouette
         reads on light tab chrome (the common case). -->
    <radialGradient id="orb" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="50%" stop-color="#1c1c22"/>
      <stop offset="100%" stop-color="#08080c"/>
    </radialGradient>
    <!-- Highlight: bright specular. This is the part that stays visible
         on dark tab chrome, where the dark body would otherwise vanish. -->
    <radialGradient id="shine" cx="0.32" cy="0.26" r="0.22">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#orb)"/>
  <ellipse cx="22" cy="20" rx="8" ry="6" fill="url(#shine)"/>
  <!-- Mid-tone hairline outline — adds shape definition at tiny sizes
       (16×16) where the gradient detail collapses to a flat tone. -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#3f3f46" stroke-width="0.6"/>
</svg>
